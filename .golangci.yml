version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosec
    - revive
    - gocritic
    - bodyclose
    - sqlclosecheck
    - misspell
  settings:
    gocritic:
      disabled-tags:
        - opinionated

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/santaniello/athena
