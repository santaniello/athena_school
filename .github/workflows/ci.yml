name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.12.2
  GOVULNCHECK_VERSION: v1.1.4

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Check frontend formatting
        run: |
          cd frontend
          npm run format:check

      - name: Test frontend
        run: |
          cd frontend
          npm run test:coverage

      - name: Install Linux cgo dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Run tests with coverage
        run: |
          MODULE="$(go list -m)"
          PACKAGES="$(go list ./... | grep -v "^${MODULE}\$")"
          go test -race -coverprofile=coverage.out ${PACKAGES}

      - name: Check coverage threshold
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${TOTAL}%"
          if awk "BEGIN{exit !($TOTAL < 80)}"; then
            echo "::error::Coverage ${TOTAL}% is below the required 80% threshold."
            exit 1
          fi

      - name: Check for suppressed security findings
        run: |
          if grep -rn --include="*.go" -E '//\s*(nolint:.*gosec|nosec)' .; then
            echo "::error::Security finding suppression detected. Fix the root cause instead."
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-mode: goinstall

      - name: Check for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          govulncheck ./...

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commit-lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout (full PR history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          chmod +x .githooks/commit-msg
          FAILED=0
          while IFS= read -r subject; do
            TMP="$(mktemp)"
            printf '%s\n' "$subject" > "$TMP"
            if ! .githooks/commit-msg "$TMP"; then
              FAILED=1
            fi
            rm -f "$TMP"
          done < <(git log --format=%s "origin/${{ github.base_ref }}..HEAD")
          exit $FAILED
