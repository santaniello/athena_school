name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.12.2
  GOVULNCHECK_VERSION: v1.1.4

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Check frontend formatting
        run: |
          cd frontend
          npm run format:check

      - name: Test frontend
        run: |
          cd frontend
          npm run test:coverage

      # libwebkit2gtk-4.1-dev pulls a 167-package / 58.5 MB dependency
      # closure that apt re-downloaded on every run. The Azure mirror serves
      # it at wildly varying speeds — measured between 19s and 6min52s (at
      # 142 kB/s) for the identical package set — which made this single step
      # the dominant, and most unpredictable, cost of the whole gate. The set
      # never changes between runs, so cache the .deb archives and install
      # them offline with dpkg. The key carries the runner image version
      # because apt resolves the closure against what the image already has;
      # bump the -vN suffix to force a refresh for any other reason.
      #
      # ImageOS/ImageVersion are process env vars on the runner, not entries
      # in the `env` expression context, so they have to be read inside a
      # `run:` step — `${{ env.ImageVersion }}` in the key silently expands
      # to an empty string.
      - name: Resolve runner image version
        id: image
        run: |
          if [ -z "${ImageOS}" ] || [ -z "${ImageVersion}" ]; then
            echo "::error::ImageOS/ImageVersion unset — the apt cache key would not track the runner image."
            exit 1
          fi
          echo "id=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Cache cgo dependency packages
        id: apt-cache
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-cgo-${{ steps.image.outputs.id }}-webkit2gtk41-v1

      - name: Download cgo dependency packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --download-only \
            -o Dir::Cache::archives="$HOME/apt-archives" \
            libgtk-3-dev libwebkit2gtk-4.1-dev
          sudo chown -R "$USER" ~/apt-archives

      # A restored .deb set is resolved against the runner image it was built
      # on. The cache key tracks that image, but a stale or partial archive
      # would otherwise fail the job outright — fall back to a plain apt
      # install so the gate stays green (just slow) instead of going red on
      # an infrastructure detail.
      - name: Install Linux cgo dependencies
        run: |
          if ! sudo dpkg --install --skip-same-version ~/apt-archives/*.deb; then
            echo "::warning::Cached .deb set did not install cleanly — falling back to apt."
            sudo apt-get update
            sudo apt-get install -y --fix-broken libgtk-3-dev libwebkit2gtk-4.1-dev
          fi

      - name: Run tests with coverage
        run: |
          MODULE="$(go list -m)"
          PACKAGES="$(go list ./... | grep -v "^${MODULE}\$" | grep -v '/mocks$')"
          go test -race -coverprofile=coverage.out ${PACKAGES}

      - name: Check coverage threshold
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${TOTAL}%"
          if awk "BEGIN{exit !($TOTAL < 80)}"; then
            echo "::error::Coverage ${TOTAL}% is below the required 80% threshold."
            exit 1
          fi

      - name: Check for suppressed security findings
        run: |
          if grep -rn --include="*.go" -E '//\s*(nolint:.*gosec|nosec)' .; then
            echo "::error::Security finding suppression detected. Fix the root cause instead."
            exit 1
          fi

      # install-mode is left at the action's default (binary): the v2.12.2
      # release binary is built with go1.26.2, so it no longer trips the
      # "built with an older Go than go.mod targets" refusal that forced
      # goinstall back on v1.64.8. Building it from source cost ~45s a run.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Check for known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
          govulncheck ./...

  mutation-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run mutation testing (Gremlins)
        run: make mutation-go

  mutation-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      # Full runs (push to main/develop) reuse the previous run's mutant
      # results via Stryker's incremental mode, so only mutants affected by
      # the diff since the cached run are re-executed. Keyed per branch so
      # main/develop each keep their own history; restore-keys falls back to
      # the latest cache for the branch when the exact run-id key misses.
      - name: Restore incremental mutation report
        if: github.event_name == 'push'
        uses: actions/cache@v6
        with:
          path: frontend/reports/stryker-incremental.json
          key: stryker-incremental-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-${{ github.ref_name }}-

      - name: Run full mutation testing (Stryker, incremental)
        if: github.event_name == 'push'
        run: |
          cd frontend
          npx stryker run --incremental

      # PRs only mutate files actually changed vs. the base branch, instead
      # of the whole frontend/src tree, so feedback stays fast regardless of
      # whether an incremental cache exists for this branch yet.
      - name: Run mutation testing on changed files (Stryker)
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" \
            | grep -E '^frontend/src/.*\.(ts|tsx)$' \
            | grep -Ev '\.test\.(ts|tsx)$|/components/ui/|^frontend/src/lib/utils\.ts$|^frontend/src/main\.tsx$|^frontend/src/vite-env\.d\.ts$' \
            | sed 's#^frontend/##' || true)
          if [ -z "$CHANGED" ]; then
            echo "No mutation-relevant frontend files changed — skipping Stryker."
            exit 0
          fi
          echo "Mutating changed files:"
          echo "$CHANGED"
          cd frontend
          npx stryker run --mutate "$(echo "$CHANGED" | paste -sd, -)"

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commit-lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout (full PR history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate commit messages
        run: |
          chmod +x .githooks/commit-msg
          FAILED=0
          while IFS= read -r subject; do
            TMP="$(mktemp)"
            printf '%s\n' "$subject" > "$TMP"
            if ! .githooks/commit-msg "$TMP"; then
              FAILED=1
            fi
            rm -f "$TMP"
          done < <(git log --format=%s "origin/${{ github.base_ref }}..HEAD")
          exit $FAILED
