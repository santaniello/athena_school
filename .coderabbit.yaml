# CodeRabbit configuration — https://docs.coderabbit.ai/reference/yaml-template
#
# CodeRabbit already reads AGENTS.md as code guidelines by default, so this file
# does not repeat those rules. It adds what prose cannot express: per-path scope,
# generated-code filters and the linters this project already runs in CI.

language: pt-BR

tone_instructions: >-
  Revise como um engenheiro sênior de Go. Seja direto e específico.
  Não aponte nitpicks de estilo que o golangci-lint ou o prettier já cobrem.

reviews:
  profile: chill

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    # CodeRabbit auto-reviews only the default branch (main) unless other base
    # branches are listed here. CI accepts PRs against develop too, so most work
    # would otherwise open without a review. Entries are regex patterns.
    base_branches:
      - develop

  # Exclusions only — everything not listed here is still reviewed.
  path_filters:
    - "!**/mocks/**" # generated by Mockery (make mock)
    - "!frontend/wailsjs/**" # generated by Wails
    - "!frontend/dist/**"
    - "!frontend/coverage/**"
    - "!frontend/reports/**"
    - "!build/**"

  path_instructions:
    - path: "internal/domain/**/*.go"
      instructions: >-
        Camada de domínio da arquitetura hexagonal. Sinalize qualquer import de
        internal/infrastructure ou internal/interfaces — a dependência aponta só
        para dentro. Regra de negócio vive exclusivamente aqui. Erros sempre
        tratados explicitamente, nunca descartados com `_`.

    - path: "internal/application/**/*.go"
      instructions: >-
        Casos de uso: orquestram domínio e infraestrutura, não contêm regra de
        negócio própria. Mocks devem vir do subpacote `mocks` irmão (Mockery),
        nunca in-package.

    - path: "internal/infrastructure/**/*.go"
      instructions: >-
        Adaptadores. Depende de interfaces do domínio, nunca o contrário.
        Segurança: subprocessos só via exec.Command com args separados (jamais
        `sh -c` ou concatenação de input do usuário); caminhos sob ~/.athena/
        validados contra path traversal; arquivos escritos com permissão 0600;
        zero segredos hardcoded. Sem dependências CGO (o driver SQLite deve
        continuar pure Go).

    - path: "internal/interfaces/desktop/**/*.go"
      instructions: >-
        Bindings Wails são adaptadores finos: validar input, chamar o caso de
        uso, retornar o resultado. Nenhuma regra de negócio aqui.

    - path: "**/*_test.go"
      instructions: >-
        Testes devem seguir GivenWhenThen (arrange/act/assert explícitos) e usar
        testify (assert/require). O nome do teste descreve o comportamento
        esperado. Parâmetros de mock tipados explicitamente — sinalize
        mock.Anything e mock.AnythingOfType quando houver valor exato viável.

    - path: "frontend/src/**/*.{ts,tsx}"
      instructions: >-
        React nunca contém regra de negócio — chama apenas bindings Wails.
        Texto de UI voltado ao usuário em Inglês (ver AGENTS.md §Language,
        alterado no commit bee6472 de Português (BR) para Inglês);
        identificadores, comentários e nomes de arquivo também em Inglês.

    - path: "**/*.go"
      instructions: >-
        Nunca aceite supressão de finding de segurança: `//nolint:gosec`,
        `#nosec` ou equivalente devem ser sinalizados como bloqueantes — a
        correção é na raiz. Todo identificador e comentário em Inglês.

  # Gate-level rules from AGENTS.md that are not line-level findings.
  # All in `warning` mode: they surface in the PR without blocking the merge.
  pre_merge_checks:
    title:
      mode: warning
      requirements: >-
        O título deve seguir Conventional Commits:
        `<type>(<scope>): <description>` com type em
        feat|fix|refactor|test|docs|chore|ci, descrição em Inglês,
        minúscula, no imperativo e sem ponto final.
    custom_checks:
      - name: CHANGELOG atualizado
        mode: warning
        instructions: >-
          Toda mudança precisa de uma entrada na seção `[Unreleased]` do
          CHANGELOG.md, sob a categoria correta (Added, Changed, Fixed,
          Removed, Deprecated ou Security). Aprove se o PR só toca
          documentação, configuração de tooling ou o próprio CHANGELOG.md.
      - name: TDD - teste acompanha implementacao
        mode: warning
        instructions: >-
          Mudanças em código de produção sob internal/ ou frontend/src/
          devem vir acompanhadas de teste correspondente no mesmo PR.
          Aprove se o PR for exclusivamente refactor sem mudança de
          comportamento, ou se tocar apenas docs, config ou mocks gerados.

  # No `tools` block on purpose. Every CodeRabbit linter is enabled by default,
  # and config discovery is recursive — `.golangci.yml` and
  # `frontend/eslint.config.js` are both found on their own. Setting
  # `config_file` would not just be redundant: it pins that one file for every
  # path in the repository and disables recursive discovery.
  #
  # Note that CodeRabbit's ESLint pass never actually runs here.
  # `frontend/eslint.config.js` uses `eslint-plugin-react-refresh`, which is not
  # on CodeRabbit's plugin allow-list, and an unsupported plugin makes it skip
  # ESLint for the whole run. That is acceptable: `npm run lint` in the
  # `quality-gate` CI job is a required status check, so the frontend is already
  # covered where it counts. Dropping the plugin to satisfy CodeRabbit would
  # trade a working HMR-correctness rule for a redundant lint pass.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
